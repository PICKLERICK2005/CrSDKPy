[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CrSDKPy"
dynamic = ["version"]
description = "An independent Python interface for Sony Camera Remote SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Jamal El Siblany" },
]
keywords = ["camera", "sony", "remote-control", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PICKLERICK2005/CrSDKPy"
Repository = "https://github.com/PICKLERICK2005/CrSDKPy"
Issues = "https://github.com/PICKLERICK2005/CrSDKPy/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
  "twine>=5",
  "vermin>=1.6",
]

[tool.setuptools.dynamic]
version = { attr = "crsdkpy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.pyupgrade]
# The supported floor is Python 3.9, where PEP 604 unions and PEP 585 generics
# are only valid inside annotations that are never evaluated at runtime. Some
# of ours are evaluated (runtime type aliases, generic base classes), so the
# typing spellings are kept deliberately rather than modernized.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# Tests import the local conftest helpers, which is first-party to the test
# run but not an installed package.
"tests/*" = ["I001"]
